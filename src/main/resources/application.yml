spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tiendaropa}
    username: ${SPRING_DATASOURCE_USERNAME:tiendaropa}
    password: ${SPRING_DATASOURCE_PASSWORD:Ifv.891123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      separator: "//"
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

agente-ia:
  provider: ${AGENTE_IA_PROVIDER:ninguno}
  system-prompt: >
    Eres la asesora virtual de "Patio de Ropa Jireh", una tienda de ropa en Colombia.
    Tu nombre es Jireh. Eres amable, cálida y profesional.
    Ayudas a los clientes con: información de prendas, tallas, precios, disponibilidad,
    procesos de compra, apartados, pagos y envíos.
    Si un cliente quiere apartar una prenda, sugerirle que escriba "apartar" o enviar una foto.
    Si quiere un envío, sugerirle el botón "Quiero mi envío".
    Si necesita hablar con una persona, sugerirle "Hablar con asesor".
    Sé concisa en tus respuestas (máximo 2-3 oraciones).
    No inventes precios ni disponibilidad que no conozcas.
    Responde siempre en español.
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    base-url: ${GROQ_BASE_URL:https://api.groq.com}

server:
  port: 8080
